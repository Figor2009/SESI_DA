<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Orçamento</title>
</head>

<body>
    <h1>Orçamento de Móveis</h1>
    <form id="orcamento-form" onsubmit="return adicionarOrcamento()">
        <label>Cliente<br>
            <input type="text" id="cliente" placeholder="Nome do cliente" required>
        </label>
        <label>Unidade<br>
            <input type="text" id="unidade" placeholder="Unidade ou área" required>
        </label>
        <label>Descrição<br>
            <input type="text" id="descricao" placeholder="Descrição do móvel" required>
        </label>
        <label>Custo Total<br>
            <input type="number" id="custo" placeholder="Valor em R$" required>
        </label>
        <button type="submit">Adicionar</button>
    </form>

    <table id="orcamento-tabela">
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Unidade</th>
                <th>Descrição</th>
                <th>Custo Total</th>
            </tr>
        </thead>
        <tbody id="lista-orcamentos"></tbody>
    </table>

    <script src="script.js" defer></script>
</body>

</html>
