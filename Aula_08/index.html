<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Orçamento</title>
</head>

<body>
    <h1>Orçamento de Móveis</h1>
    <form id="orcamento-form" onsubmit="return adicionarOrcamento()">
        <div class="group-input">
            <label>Cliente</label>
            <input type="text" id="cliente" placeholder="Nome do cliente" required>
        </div>

        <div class="group-input">
            <label>Unidade </label>
            <select name="móveis" id="mobile">
                <option value="sofa">Sofa</option>
                <option value="cadeira">Cadeira</option>
                <option value="geladeira">Geladeira</option>
                <option value="fogao">Fogão</option>
            </select>
        </div>

        <div class="group-input">
            <label>Descrição</label>
            <input type="text" id="descricao" placeholder="Descrição do móvel" required>
        </div>


        <div class="group-input">
            <label>Custo Total</label>
            <input type="number" id="custo" placeholder="Valor em R$" required>
        </div>

        <button type="submit">Adicionar</button>
    </form>

    <table id="orcamento-tabela">
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Unidade</th>
                <th>Descrição</th>
                <th>Custo Total</th>
            </tr>
        </thead>
        <tbody id="lista-orcamentos"></tbody>
    </table>

    <script src="script.js" defer></script>
</body>

</html>
